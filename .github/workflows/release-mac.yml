# Adds the macOS build to the existing GitHub Release (v0.1.0). It uploads
# only the macOS zip and appends the macOS notes; the Windows asset and the
# existing release text are left as they are.
name: Publish macOS build

on:
  push:
    branches:
      - claude/busy-albattani-pu01dl
    paths:
      - "release/NeonVanguard_macOS.zip"
      - ".github/RELEASE_NOTES_MAC.md"
      - ".github/workflows/release-mac.yml"

env:
  RELEASE_TAG: v0.1.0

permissions:
  contents: write

jobs:
  release-mac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check macOS zip
        run: |
          ls -la release/
          sha256sum release/NeonVanguard_macOS.zip
          unzip -l release/NeonVanguard_macOS.zip

      - name: Attach macOS build to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: NEON VANGUARD ${{ env.RELEASE_TAG }} - first playable prototype
          prerelease: true
          body_path: .github/RELEASE_NOTES_MAC.md
          append_body: true
          files: release/NeonVanguard_macOS.zip
