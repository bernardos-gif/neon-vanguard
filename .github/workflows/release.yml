# Publishes a GitHub Release with the packaged Windows build. Runs when a
# version tag (v*) is pushed, or when the release files change on the
# development branch (then it creates the tag below itself). The zip is built
# locally with Godot and committed under release/ (see BUILD_WINDOWS.md).
name: Publish release

on:
  push:
    tags:
      - "v*"
    branches:
      - claude/busy-albattani-pu01dl
    paths:
      - "release/NeonVanguard_Windows_x86_64.zip"
      - ".github/RELEASE_NOTES.md"

env:
  RELEASE_TAG: v0.1.0

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check release files
        run: |
          ls -la release/
          sha256sum release/NeonVanguard_Windows_x86_64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: NEON VANGUARD ${{ github.ref_type == 'tag' && github.ref_name || env.RELEASE_TAG }} - first playable prototype
          prerelease: true
          body_path: .github/RELEASE_NOTES.md
          files: release/NeonVanguard_Windows_x86_64.zip
